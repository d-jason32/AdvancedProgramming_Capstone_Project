<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Jitsi Meet Call</title>
    <script src="https://meet.jit.si/external_api.js"></script>
    <script src="https://www.whiteboard.team/dist/api.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: sans-serif;
        }

        #main-container {
            display: flex;
            height: 100%;
            width: 100%;
        }

        #jitsi-container, #wt-container {
            flex: 1;
            height: 100%;
        }
    </style>
</head>
<body>
<div id="main-container">
    <div id="jitsi-container"></div>
    <div id="wt-container"></div>
</div>

<script>
    let roomName = "TestRoom";
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('room')) {
        roomName = urlParams.get('room');
    }

    const domain = "meet.jit.si";
    const options = {
        roomName: roomName,
        width: "100%",
        height: "100%",
        parentNode: document.querySelector("#jitsi-container"),
        configOverwrite: {
            startWithAudioMuted: false,
            startWithVideoMuted: false,
            disableDeepLinking: true
        },
        interfaceConfigOverwrite: {
            TOOLBAR_BUTTONS: [
                'microphone', 'camera', 'hangup', 'chat', 'recording', 'settings'
            ]
        }
    };

    const jitsiApi = new JitsiMeetExternalAPI(domain, options);

    console.log("Initialized Jitsi Meet with room:", roomName);
    const wt = new api.WhiteboardTeam('#wt-container', {
        clientId: '826eece0e58a661b21e57fdde1c4b032', // Replace with your actual clientId
        boardCode: '22b58b6b-147c-48d4-8c84-6209d3816837'   // Replace with your actual board code
    });
</script>
</body>
</html>
